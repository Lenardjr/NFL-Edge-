name: Validate NFL Edge Engines
on:
  push:
    branches: [main]
    paths:
      - 'player_engine.py'
      - 'player_validation.py'
      - 'player_backtest.py'
      - 'game_engine.py'
      - 'live_game.py'
      - 'week6_backtest.py'
      - 'week6_championship.py'
      - 'engine_1_1_diagnostics.py'
      - 'app.py'
      - 'test_player_engine.py'
      - 'test_player_validation.py'
      - 'test_player_backtest.py'
      - 'requirements.txt'
      - '.github/workflows/validate-player-engine.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Syntax validation
        run: |
          python -m py_compile player_engine.py player_validation.py player_backtest.py game_engine.py live_game.py week6_backtest.py week6_championship.py engine_1_1_diagnostics.py app.py nfl_edge.py
      - name: Unit tests
        run: pytest -q test_player_engine.py test_player_validation.py test_player_backtest.py
      - name: Week 6 retrospective championship
        run: python week6_championship.py
      - name: Engine 1.1 diagnostic report
        run: python engine_1_1_diagnostics.py
