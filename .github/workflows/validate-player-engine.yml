name: Validate NFL Edge Engines
on:
  push:
    branches: [main]
    paths:
      - 'player_engine.py'
      - 'player_validation.py'
      - 'player_backtest.py'
      - 'player_stat_engine.py'
      - 'player_stat_backtest.py'
      - 'player_stat_championship.py'
      - 'player_stat_qb_challenger.py'
      - 'qb_stat_championship.py'
      - 'qb_stat_v03_challenger.py'
      - 'qb_stat_v03_championship.py'
      - 'qb_stat_v04_context.py'
      - 'qb_stat_v04_championship.py'
      - 'game_engine.py'
      - 'live_game.py'
      - 'week6_backtest.py'
      - 'week6_championship.py'
      - 'game_betting_lab.py'
      - 'game_betting_diagnostics.py'
      - 'spread_walkforward.py'
      - 'game_betting_multiseason.py'
      - 'spread_signal_research.py'
      - 'engine_1_1_diagnostics.py'
      - 'engine_1_1_challenger.py'
      - 'engine_1_1_b_challenger.py'
      - 'prospective_holdout.py'
      - 'prospective_ledger.py'
      - 'prospective/**'
      - 'baselines/engine_1_1_b_candidate_2026w6.json'
      - 'app.py'
      - 'test_player_engine.py'
      - 'test_player_validation.py'
      - 'test_player_backtest.py'
      - 'test_player_stat_engine.py'
      - 'test_player_stat_qb_challenger.py'
      - 'test_qb_stat_v04_context.py'
      - 'test_game_betting_lab.py'
      - 'test_game_betting_diagnostics.py'
      - 'test_spread_walkforward.py'
      - 'test_game_betting_multiseason.py'
      - 'test_spread_signal_research.py'
      - 'test_week6_backtest.py'
      - 'test_prospective_holdout.py'
      - 'test_prospective_ledger.py'
      - 'requirements.txt'
      - '.github/workflows/validate-player-engine.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Syntax validation
        run: |
          python -m py_compile player_engine.py player_validation.py player_backtest.py player_stat_engine.py player_stat_backtest.py player_stat_championship.py player_stat_qb_challenger.py qb_stat_championship.py qb_stat_v03_challenger.py qb_stat_v03_championship.py qb_stat_v04_context.py qb_stat_v04_championship.py game_engine.py live_game.py week6_backtest.py week6_championship.py game_betting_lab.py game_betting_diagnostics.py spread_walkforward.py game_betting_multiseason.py spread_signal_research.py engine_1_1_diagnostics.py engine_1_1_challenger.py engine_1_1_b_challenger.py prospective_holdout.py prospective_ledger.py test_player_stat_engine.py test_player_stat_qb_challenger.py test_qb_stat_v04_context.py test_game_betting_lab.py test_game_betting_diagnostics.py test_spread_walkforward.py test_game_betting_multiseason.py test_spread_signal_research.py test_week6_backtest.py test_prospective_holdout.py test_prospective_ledger.py app.py nfl_edge.py
      - name: Unit tests
        run: pytest -q test_player_engine.py test_player_validation.py test_player_backtest.py test_player_stat_engine.py test_player_stat_qb_challenger.py test_qb_stat_v04_context.py test_game_betting_lab.py test_game_betting_diagnostics.py test_spread_walkforward.py test_game_betting_multiseason.py test_spread_signal_research.py test_week6_backtest.py test_prospective_holdout.py test_prospective_ledger.py
      - name: Prospective ledger audit
        run: python prospective_ledger.py
      - name: Week 6 retrospective championship
        run: python week6_championship.py
      - name: Week 6 betting laboratory
        run: python game_betting_lab.py
      - name: Betting calibration and disagreement diagnostics
        run: python game_betting_diagnostics.py
      - name: Fixed-rule spread walk-forward
        run: python spread_walkforward.py
      - name: Multi-season fixed-rule spread validation
        run: python game_betting_multiseason.py
      - name: Spread signal research 2023-2025
        run: python spread_signal_research.py
      - name: Player production Week 6 championship
        run: python player_stat_championship.py
      - name: QB production challenger Week 6 championship
        run: python qb_stat_championship.py
      - name: QB v0.3 multi-week comparison
        run: python qb_stat_v03_championship.py
      - name: QB v0.4 game-context comparison
        run: python qb_stat_v04_championship.py
      - name: Engine 1.1 diagnostic report
        run: python engine_1_1_diagnostics.py
      - name: Engine 1.1-A challenger comparison
        run: python engine_1_1_challenger.py
      - name: Engine 1.1-B multi-week championship
        run: python engine_1_1_b_challenger.py
