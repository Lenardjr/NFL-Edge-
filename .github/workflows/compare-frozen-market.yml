name: Compare Frozen NFL Model vs Market
on:
  workflow_dispatch:
  schedule:
    - cron: '30 12 * * *'
permissions:
  contents: write
  actions: read
concurrency:
  group: nfl-frozen-evaluation-archive
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/model-validation-2026
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: pip install pandas numpy
      - name: Run comparison tests
        run: python -m unittest research.test_compare_frozen_market research.test_collect_cohort_scores -v
      - uses: actions/checkout@v4
        with:
          ref: main
          path: archive_repo
      - name: Restore permanent original market snapshot
        id: restore
        run: |
          if [ -d archive_repo/research_archive/2026-11-19/original_market ]; then
            cp -a archive_repo/research_archive/2026-11-19/original_market original_pregame_market
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Download original pregame odds snapshot
        if: steps.restore.outputs.found != 'true'
        uses: actions/download-artifact@v4
        with:
          name: nfl-research-moneylines-44789837947
          run-id: 44789837947
          github-token: ${{ github.token }}
          path: original_pregame_market
      - name: Verify frozen cohort and archived quote manifest
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path("research/frozen_cohorts/2026-11-19-v3-15-games.csv")
          assert hashlib.sha256(p.read_bytes()).hexdigest()=="f836e4e17f7a0b5062e757e0faf7d346f748bfce6f878aaca88e5966bf93af41"
          manifest=list(Path("original_pregame_market").glob("moneyline_manifest_*.json"))
          assert len(manifest)==1, "Expected exactly one original market manifest"
          data=json.loads(manifest[0].read_text())
          assert data["cohort_sha256"]==hashlib.sha256(p.read_bytes()).hexdigest()
          assert data["pregame_only"] is True
          assert len(list(Path("original_pregame_market").glob("moneyline_snapshot_*.csv")))==1
          PY
      - name: Fetch completed results without changing predictions
        run: |
          python -m research.collect_cohort_scores \
            --cohort research/frozen_cohorts/2026-11-19-v3-15-games.csv \
            --output-dir research_outputs/paired_evaluation
      - name: Score paired pregame model and sportsbook probabilities
        run: |
          python -m research.compare_frozen_market \
            --cohort research/frozen_cohorts/2026-11-19-v3-15-games.csv \
            --results research_outputs/paired_evaluation/cohort_verified_results.csv \
            --quotes original_pregame_market/moneyline_snapshot_*.csv \
            --output-dir research_outputs/paired_evaluation
      - name: Preserve original market snapshot provenance
        run: cp original_pregame_market/moneyline_manifest_*.json research_outputs/paired_evaluation/
      - name: Upload paired evaluation
        uses: actions/upload-artifact@v4
        with:
          name: nfl-model-vs-market-${{ github.run_id }}
          path: research_outputs/paired_evaluation/
          retention-days: 90
      - name: Preserve verified research history
        run: |
          set -eu
          base=archive_repo/research_archive/2026-11-19
          mkdir -p "$base/original_market" "$base/evaluations/${{ github.run_id }}"
          cp -n original_pregame_market/moneyline_snapshot_*.csv original_pregame_market/moneyline_manifest_*.json "$base/original_market/"
          cp -n research/frozen_cohorts/2026-11-19-v3-15-games.csv "$base/"
          cp -n research_outputs/paired_evaluation/* "$base/evaluations/${{ github.run_id }}/"
          cd archive_repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_archive/2026-11-19
          if ! git diff --cached --quiet; then
            git commit -m "Archive frozen NFL research evaluation ${{ github.run_id }}"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
