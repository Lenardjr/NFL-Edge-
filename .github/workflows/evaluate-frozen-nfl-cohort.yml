name: Evaluate Frozen NFL Research Cohort
on:
  workflow_dispatch:
  schedule:
    - cron: '15 11 * * *'
permissions:
  contents: read
  actions: read
jobs:
  prepare-fixed-cohort:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/model-validation-2026
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install evaluation dependencies
        run: pip install pandas numpy
      - name: Test outcome scoring logic
        run: python -m unittest research.test_score_frozen_cohort research.test_collect_cohort_scores -v
      - name: Load archived Nov 19 cohort from research branch
        run: |
          mkdir -p frozen_original/next_slate
          cp research/frozen_cohorts/2026-11-19-v3-15-games.csv frozen_original/next_slate/next_slate_v3_research.csv
      - name: Verify fixed cohort hash and count
        run: |
          python - <<'PY'
          import hashlib,pandas as pd
          from pathlib import Path
          path=Path("frozen_original/next_slate/next_slate_v3_research.csv")
          expected="f836e4e17f7a0b5062e757e0faf7d346f748bfce6f878aaca88e5966bf93af41"
          assert hashlib.sha256(path.read_bytes()).hexdigest()==expected, "Original cohort checksum mismatch"
          assert len(pd.read_csv(path))==15, "Unexpected cohort size"
          print("Original 15-game cohort verified; no predictions changed")
          PY
      - name: Prepare results template without scoring unfinished games
        run: |
          python -m research.prepare_cohort_outcomes \
            --cohort frozen_original/next_slate/next_slate_v3_research.csv \
            --output-dir research_outputs/cohort_evaluation
          cp frozen_original/next_slate/next_slate_v3_research.csv research_outputs/cohort_evaluation/original_frozen_cohort.csv
      - name: Fetch completed NFL results from public scoreboard
        run: |
          python -m research.collect_cohort_scores \
            --cohort frozen_original/next_slate/next_slate_v3_research.csv \
            --output-dir research_outputs/cohort_evaluation
      - name: Score only verified completed games
        run: |
          python -m research.score_frozen_cohort \
            --cohort frozen_original/next_slate/next_slate_v3_research.csv \
            --results research_outputs/cohort_evaluation/cohort_verified_results.csv \
            --output-dir research_outputs/cohort_evaluation
      - name: Upload fixed cohort and evaluation template
        uses: actions/upload-artifact@v4
        with:
          name: nfl-nov19-frozen-cohort-evaluation
          path: research_outputs/cohort_evaluation/
